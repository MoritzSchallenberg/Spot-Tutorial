name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  examples:
    name: Build and test the example ROS 2 packages
    # Independent of the Sphinx build/deploy below: this never blocks or
    # delays publishing the site, it only checks that the example package(s)
    # referenced from the course pages actually build under ROS 2 Humble.
    #
    # action-ros-ci does its own checkout of "the code under test" via vcs,
    # and recursively discovers every package.xml in the repository -- no
    # explicit actions/checkout step or colcon path override needed, and a
    # previous version of this job that added both failed for reasons the
    # log did not make visible. This matches ros-tooling/action-ros-ci's own
    # minimal documented usage exactly.
    runs-on: ubuntu-22.04
    steps:
      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Build and test turtle_tutorial (ROS 2 topic)
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: turtle_tutorial
          target-ros2-distro: humble

  build:
    name: Build the Sphinx site
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the site
        # -W turns warnings into errors, so a broken link or a bad
        # cross-reference fails the build instead of shipping quietly.
        # --keep-going reports every problem in one run rather than the first.
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check that no secrets reached the output
        # Cheap safety net: the repository is public, and the source material
        # this site was built from contained cleartext credentials and signed
        # URLs. See SECURITY_REVIEW.md.
        #
        # The credential pattern is applied to the generated content pages
        # only. Scanning _static/ as well produces false positives from
        # third-party assets -- Font Awesome ships a `.fa-user-secret:before`
        # rule that matches any naive "secret:" pattern.
        run: |
          set -e
          echo "Scanning build output for secrets and internal data..."
          fail=0

          echo "-> signed / tokenised URLs (whole output)"
          if grep -rEn 'X-Amz-|Signature=|[?&]jwt=|[?&]token=' \
               docs/_build/html; then
            echo "::error::Signed or tokenised URL found in the build output"
            fail=1
          fi

          echo "-> private key material (whole output)"
          if grep -rEn 'BEGIN [A-Z ]*PRIVATE KEY|ssh-rsa AAAA|ssh-ed25519 AAAA' \
               docs/_build/html; then
            echo "::error::Private key material found in the build output"
            fail=1
          fi

          echo "-> credentials (generated content pages)"
          if grep -rEn --include='*.html' \
               '(password|passwd|secret|api[_-]?key|token|credential)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_./+-]{6,}' \
               docs/_build/html; then
            echo "::error::Possible credential found in the generated pages"
            fail=1
          fi

          echo "-> internal hosts and private repositories (content pages)"
          if grep -rEn --include='*.html' \
               'git\.fh-aachen\.de|private-user-images\.githubusercontent\.com' \
               docs/_build/html; then
            echo "::error::Internal host or private image URL found"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK: no secrets found in the build output."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Encrypt the site behind a password gate
        # The task requires a static-hosting access hurdle (StatiCrypt),
        # not real server-side authentication -- see README.md. The
        # password itself must never appear in a log or in the repository:
        # it is read from the STATICRYPT_PASSWORD secret via the
        # environment, which staticrypt's CLI picks up automatically
        # (never passed as a -p command-line argument, which would show up
        # in the Action's own "Run" log line). -r encrypts every HTML file
        # recursively, so direct subpages are protected too, not only the
        # site root. The build must fail, not deploy an unprotected site,
        # if the secret is missing -- so this step checks for it itself
        # rather than letting a blank password silently produce an
        # unlocked page.
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          set -e
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::STATICRYPT_PASSWORD secret is not set -- refusing to deploy an unprotected site. See README.md for the required manual setup step."
            exit 1
          fi
          npx --yes staticrypt@3.5.4 docs/_build/html -d docs/_build/encrypted -r --short
          echo "OK: site encrypted to docs/_build/encrypted/html"

      - name: Check external links
        # Informational only. Internal links and images are already validated
        # by the `-W` build above; this step checks that external URLs still
        # resolve. External sites go down, rate-limit and block CI runners, so
        # it must never be the reason a deploy fails -- and it must never hang:
        # a single slow host can otherwise stall the job for hours.
        timeout-minutes: 6
        continue-on-error: true
        run: |
          timeout 300 sphinx-build -b linkcheck docs docs/_build/linkcheck \
            || echo "linkcheck did not finish cleanly (informational only)"
          echo "--- linkcheck summary ---"
          if [ -s docs/_build/linkcheck/output.txt ]; then
            cat docs/_build/linkcheck/output.txt
          else
            echo "No broken links reported."
          fi

      - name: Upload the Pages artifact
        # Only the deploy job needs the artifact, but uploading on pull
        # requests too confirms the artifact step itself works. The
        # encrypted output (docs/_build/encrypted/html), never the raw
        # unprotected build, is what gets published -- see "Encrypt the
        # site behind a password gate" above.
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/encrypted/html

  deploy:
    name: Deploy to GitHub Pages
    # Only deploy from main -- pull requests build but never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Smoke test the deployed site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify the live site is up and gated
        # GitHub Pages can take a short while to actually start serving a
        # fresh deployment even after the deploy step reports success, so
        # this retries with a fixed, bounded budget (10 attempts x 10s =
        # 100s max) rather than looping indefinitely or trusting the first
        # response.
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          echo "Testing $SITE_URL"

          status="000"
          for i in $(seq 1 10); do
            status=$(curl -fsSL -o /tmp/homepage.html -w "%{http_code}" "$SITE_URL" || echo "000")
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Attempt $i/10: homepage returned $status, retrying in 10s..."
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "::error::Homepage did not return 200 after 10 attempts (last status: $status)"
            exit 1
          fi
          echo "OK: homepage returned 200"

          if ! grep -qi 'staticrypt\|protected page' /tmp/homepage.html; then
            echo "::error::Homepage does not show the StatiCrypt password gate"
            exit 1
          fi
          echo "OK: password gate is present on the homepage"

          sub_status=$(curl -fsSL -o /tmp/subpage.html -w "%{http_code}" "${SITE_URL}safety/operator-checklist.html" || echo "000")
          if [ "$sub_status" != "200" ]; then
            echo "::error::Direct subpage request failed with status $sub_status"
            exit 1
          fi
          if ! grep -qi 'staticrypt\|protected page' /tmp/subpage.html; then
            echo "::error::Direct subpage access is not gated -- it may be serving real content unprotected"
            exit 1
          fi
          echo "OK: a direct subpage request is gated, not just the homepage"

          css_status=$(curl -fsSL -o /dev/null -w "%{http_code}" "${SITE_URL}_static/css/custom.css" || echo "000")
          js_status=$(curl -fsSL -o /dev/null -w "%{http_code}" "${SITE_URL}_static/js/color-mode.js" || echo "000")
          if [ "$css_status" != "200" ] || [ "$js_status" != "200" ]; then
            echo "::error::Static assets failed to load (custom.css=$css_status color-mode.js=$js_status)"
            exit 1
          fi
          echo "OK: static CSS and JavaScript files load"

          echo "Smoke test passed."
